<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block subject %}Contextify Cloud{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
</head>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#1E293B;-webkit-font-smoothing:antialiased;">
  <span style="display:none;visibility:hidden;opacity:0;color:transparent;height:0;width:0;font-size:1px;line-height:1px;overflow:hidden;mso-hide:all;">{% block preheader %}{% endblock %}</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#F8FAFC;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="height:4px;line-height:4px;font-size:0;background-color:#4A7BA7;background-image:linear-gradient(135deg,#F9B233 0%,#4AC4E0 50%,#8B5CF6 100%);">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 32px 12px 32px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="font-size:20px;letter-spacing:0.6px;color:#1E293B;text-transform:uppercase;font-weight:700;">Contextify</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 8px 32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 24px 32px;font-size:13px;line-height:20px;color:#94A3B8;">
              {% block footer %}If you didn't request this, you can safely ignore this email.{% endblock %}
            </td>
          </tr>
        </table>
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">
          <tr>
            <td align="center" style="padding:16px 32px 24px 32px;font-size:12px;line-height:18px;color:#94A3B8;">
              Contextify &middot; <a href="https://contextify.sh" style="color:#94A3B8;text-decoration:underline;">contextify.sh</a> &middot; <a href="https://contextify.sh/help" style="color:#94A3B8;text-decoration:underline;">Help</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
