services:
  api:
    build:
      context: .
    ports:
      # Manual runs and homeserver setup keep the API loopback-bound. The
      # blessed self-hosted ingress path is host-level HTTPS proxying on 443.
      - "${BIND_HOST:-127.0.0.1}:${SELF_HOSTED_API_PORT:-8443}:8443"
    environment:
      - DATABASE_URL=postgresql+asyncpg://contextify:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@db:5432/contextify
      - API_SECRET_KEY=${API_SECRET_KEY:?API_SECRET_KEY must be set in .env}
      - SELF_HOSTED=true
      - CONTEXTIFY_SELF_HOSTED_SETUP_TOKEN=${CONTEXTIFY_SELF_HOSTED_SETUP_TOKEN:?CONTEXTIFY_SELF_HOSTED_SETUP_TOKEN must be set in .env}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - JWT_TOKEN_EXPIRE_HOURS=${JWT_TOKEN_EXPIRE_HOURS:-24}
      - REAUTH_WINDOW_MINUTES=${REAUTH_WINDOW_MINUTES:-15}
      - AUTH_EMAIL_RESEND_COOLDOWN_SECONDS=${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:-180}
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-true}
      - ALLOW_MULTI_MEMBERSHIP_ACCOUNTS=${ALLOW_MULTI_MEMBERSHIP_ACCOUNTS:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,198.19.0.0/16}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@contextify.sh}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-support@contextify.sh}
      - EMAIL_BASE_URL=${EMAIL_BASE_URL:?EMAIL_BASE_URL must be set in .env}
      - AUTH_EMAIL_DELIVERY_MAX_ATTEMPTS=${AUTH_EMAIL_DELIVERY_MAX_ATTEMPTS:-3}
      - AUTH_EMAIL_RETRY_DELAY_SECONDS=${AUTH_EMAIL_RETRY_DELAY_SECONDS:-300}
      - AUTH_EMAIL_OUTBOX_INTERVAL_SECONDS=${AUTH_EMAIL_OUTBOX_INTERVAL_SECONDS:-60}
      - TOS_VERSION=${TOS_VERSION:-2026-04-24}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@contextify.sh}
      - INVITATION_BASE_URL=${INVITATION_BASE_URL:?INVITATION_BASE_URL must be set in .env}
      - INVITATION_EXPIRY_DAYS=${INVITATION_EXPIRY_DAYS:-7}
      - ERROR_MONITORING_ENABLED=${ERROR_MONITORING_ENABLED:-false}
      - ERROR_MONITORING_SEND_DEFAULT_PII=${ERROR_MONITORING_SEND_DEFAULT_PII:-false}
      - ERROR_MONITORING_MAX_EVENTS_PER_MINUTE=${ERROR_MONITORING_MAX_EVENTS_PER_MINUTE:-20}
      - OPS_SMOKE_TOKEN=${OPS_SMOKE_TOKEN:-}
      - SUPPORT_ADMIN_TOKEN=${SUPPORT_ADMIN_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-self-hosted}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - SENTRY_ERROR_SAMPLE_RATE=${SENTRY_ERROR_SAMPLE_RATE:-1.0}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-}
      - SENTRY_DEBUG=${SENTRY_DEBUG:-false}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-50000000}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-5000}
      - MAX_ENTRY_CONTENT_BYTES=${MAX_ENTRY_CONTENT_BYTES:-1000000}
      - IDEMPOTENCY_TTL_HOURS=${IDEMPOTENCY_TTL_HOURS:-24}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - RATE_LIMIT_SYNC_PER_MINUTE=${RATE_LIMIT_SYNC_PER_MINUTE:-120}
      - RATE_LIMIT_SEARCH_PER_MINUTE=${RATE_LIMIT_SEARCH_PER_MINUTE:-60}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_REGISTER_PER_MINUTE=${RATE_LIMIT_UNAUTH_REGISTER_PER_MINUTE:-5}
      - RATE_LIMIT_UNAUTH_LOGIN_PER_MINUTE=${RATE_LIMIT_UNAUTH_LOGIN_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_DEVICE_CODE_PER_MINUTE=${RATE_LIMIT_UNAUTH_DEVICE_CODE_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_DEVICE_TOKEN_PER_MINUTE=${RATE_LIMIT_UNAUTH_DEVICE_TOKEN_PER_MINUTE:-30}
      - RATE_LIMIT_UNAUTH_INVITATION_ACCEPT_PER_MINUTE=${RATE_LIMIT_UNAUTH_INVITATION_ACCEPT_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_EMAIL_INIT_PER_MINUTE=${RATE_LIMIT_UNAUTH_EMAIL_INIT_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_VERIFY_OTP_PER_MINUTE=${RATE_LIMIT_UNAUTH_VERIFY_OTP_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_LOGIN_EMAIL_LINK_PER_MINUTE=${RATE_LIMIT_UNAUTH_LOGIN_EMAIL_LINK_PER_MINUTE:-10}
      - RATE_LIMIT_UNAUTH_LOGIN_VERIFY_OTP_PER_MINUTE=${RATE_LIMIT_UNAUTH_LOGIN_VERIFY_OTP_PER_MINUTE:-10}
      - AUTH_DEVICE_TOKEN_EXPIRY_SECONDS=${AUTH_DEVICE_TOKEN_EXPIRY_SECONDS:-600}
      - AUTH_OTP_ATTEMPTS_PER_TOKEN_MAX=${AUTH_OTP_ATTEMPTS_PER_TOKEN_MAX:-5}
      - AUTH_EMAIL_SEND_CAP_PER_DEVICE_CODE=${AUTH_EMAIL_SEND_CAP_PER_DEVICE_CODE:-5}
      - DEVICE_CODE_EXPIRY_SECONDS=${DEVICE_CODE_EXPIRY_SECONDS:-900}
      - DEVICE_POLL_INTERVAL=${DEVICE_POLL_INTERVAL:-5}
      - DEFAULT_DATA_RETENTION_DAYS=${DEFAULT_DATA_RETENTION_DAYS:-0}
      - PURGE_GRACE_PERIOD_DAYS=${PURGE_GRACE_PERIOD_DAYS:-30}
      - PURGE_CHECK_INTERVAL_SECONDS=${PURGE_CHECK_INTERVAL_SECONDS:-3600}
      - PURGE_TOMBSTONE_RETENTION_MONTHS=${PURGE_TOMBSTONE_RETENTION_MONTHS:-12}
      - PURGE_BATCH_LIMIT=${PURGE_BATCH_LIMIT:-5}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/api/v1/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "2.0"
    mem_limit: 2g
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18.3-alpine3.23@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    volumes:
      - pgdata18:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=contextify
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=contextify
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextify"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    shm_size: 256mb
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata18:
    name: ${SELF_HOSTED_PGDATA_VOLUME:-contextify-cloud_selfhosted_pgdata18}
