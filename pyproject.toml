[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextify-cloud"
version = "0.1.0"
description = "Cloud sync and team features for Contextify"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Proprietary"}
authors = [
    {name = "Rob Banagale", email = "rob@contextify.sh"},
]
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.18.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.12.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.22",
    "aiosmtplib>=5.1.0",
    "email-validator>=2.3.0",
    "sentry-sdk>=2.55.0,<3",
]

[project.scripts]
contextify-cloud = "contextify_cloud.__main__:main"
contextify-purge = "contextify_cloud.cli.purge:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring real PostgreSQL and significant runtime (100K+ rows)",
    "e2e: marks tests requiring a real browser and running server",
]

[tool.mypy]
python_version = "3.13"
strict = true
